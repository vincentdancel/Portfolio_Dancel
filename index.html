<!doctype html>
<html lang="en" class="site-is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 256x256" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <meta
      name="description"
      content="Portfolio of Vince Dancel, a web developer and UI/UX designer building thoughtful digital experiences."
    />
    <meta name="theme-color" content="#0b1020" />
    <link rel="preload" as="image" href="/light-pillar-fallback.webp" />
    <style>
      .site-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #050505;
        color: #f4f3ee;
        font-family: Arial, Helvetica, sans-serif;
        opacity: 1;
        transition: opacity 350ms ease;
      }
      .site-loader.is-leaving { opacity: 0; pointer-events: none; }
      .site-loader-content { display: grid; justify-items: center; gap: 24px; }
      .site-loader-mark {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border: 1px solid rgba(0, 168, 158, 0.55);
        border-radius: 18px;
        color: #f4f3ee;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -2px;
        box-shadow: 0 0 40px rgba(0, 168, 158, 0.12);
      }
      .site-loader-name { font-size: 11px; font-weight: 700; letter-spacing: 3px; }
      .site-loader-track { width: 160px; height: 2px; overflow: hidden; background: #182322; }
      .site-loader-track::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #00a89e;
        animation: loader-travel 1.1s ease-in-out infinite;
      }
      .site-loader-label { color: #8b9694; font-size: 11px; letter-spacing: 0.5px; }
      @keyframes loader-travel {
        from { transform: translateX(-100%); }
        to { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .site-loader { transition: none; }
        .site-loader-track::after { animation: none; width: 100%; }
      }
    </style>
    <title>Vince Dancel — Portfolio</title>
  </head>
  <body>
    <div id="site-loader" class="site-loader" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="site-loader-content" aria-hidden="true">
        <span class="site-loader-mark">VD</span>
        <span class="site-loader-name">VINCE DANCEL</span>
        <span class="site-loader-track"></span>
        <span class="site-loader-label">Loading portfolio</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
